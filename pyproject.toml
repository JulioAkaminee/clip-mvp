[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-mvp"
version = "0.1.0"
description = "Cortes automáticos de vídeos longos (YouTube Shorts / TikTok / 16:9) com IA via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "yt-dlp>=2024.8.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
facetrack = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.9",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[project.scripts]
clip = "clip_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clip_mvp = ["prompts/*.md", "web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
