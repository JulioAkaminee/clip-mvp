[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-mvp"
version = "0.1.0"
description = "Cortes automaticos a partir de link (YouTube/Twitch/etc) com IA via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.scripts]
clip = "clip_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clip_mvp = ["prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
