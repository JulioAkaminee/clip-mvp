[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-mvp"
version = "0.1.0"
description = "Cortes automaticos a partir de link (YouTube/Twitch/etc) com IA via OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "yt-dlp>=2024.8.6",
  "numpy>=1.26,<2",
  "tenacity>=8.5",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
facetrack = [
  "opencv-python-headless>=4.10,<4.12",
  "mediapipe==0.10.21",
]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[project.scripts]
clip = "clip_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clip_mvp = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
